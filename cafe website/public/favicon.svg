<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="favGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D0" />
      <stop offset="40%" stop-color="#E8B34E" />
      <stop offset="70%" stop-color="#C89B3C" />
      <stop offset="100%" stop-color="#F5D77F" />
    </linearGradient>
    <linearGradient id="favDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23120A" />
      <stop offset="100%" stop-color="#0E0603" />
    </linearGradient>
    <linearGradient id="favBean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0CA" />
      <stop offset="50%" stop-color="#E8B34E" />
      <stop offset="100%" stop-color="#C1552E" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="48" height="48" rx="12" fill="url(#favDarkBg)" />
  
  <!-- Outer Gold Rings -->
  <circle cx="24" cy="24" r="21" stroke="url(#favGoldRim)" stroke-width="1.5" stroke-opacity="0.85" />
  <circle cx="24" cy="24" r="18" stroke="url(#favGoldRim)" stroke-width="0.8" stroke-dasharray="2 2" />

  <!-- 4 Cardinal Gold Accent Dots -->
  <circle cx="24" cy="4.5" r="1" fill="#FFF4D0" />
  <circle cx="24" cy="43.5" r="1" fill="#FFF4D0" />
  <circle cx="4.5" cy="24" r="1" fill="#FFF4D0" />
  <circle cx="43.5" cy="24" r="1" fill="#FFF4D0" />

  <!-- Luxury Coffee Bean -->
  <g transform="translate(24, 25) scale(0.7) translate(-24, -24)">
    <path
      d="M24 13 C16.5 13 13 18 13 24 C13 30 16.5 35 24 35 C24 35 21 29 24 24 C27 19 24 13 24 13 Z"
      fill="url(#favBean)"
    />
    <path
      d="M24 13 C31.5 13 35 18 35 24 C35 30 31.5 35 24 35 C24 35 27 29 24 24 C21 19 24 13 24 13 Z"
      fill="url(#favBean)"
    />
    <path
      d="M24 13 C21 19 27 29 24 35"
      stroke="#FFF9F0"
      stroke-width="1.5"
      stroke-linecap="round"
    />
  </g>
</svg>
